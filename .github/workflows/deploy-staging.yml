name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Test, package & apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - name: Install parser dependencies
        run: pip install -r requirements.txt pytest-cov
        working-directory: parser

      - name: Run pytest (guard against broken deploys)
        run: python -m pytest tests/
        working-directory: parser

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Builds the Lambda layer's dependency directory before Terraform ever
      # reads it: data.archive_file.layer (terraform/modules/lambda) zips
      # this directory during `terraform plan`'s refresh, which is too early
      # for a null_resource/local-exec inside that module to populate it
      # reliably on a fresh runner. Architecture/python-version here must
      # match var.lambda_architecture / the Lambda runtime default in
      # terraform/variables.tf and terraform/modules/lambda/variables.tf.
      - name: Build Lambda layer
        run: scripts/build_lambda_layer.sh parser/requirements-lambda.txt terraform/modules/lambda/build/layer 3.12 x86_64

      # No separate packaging step for the function code itself: an
      # archive_file resource zips parser/ (source_dir) directly, content-
      # hashed via source_code_hash so `terraform apply` only redeploys what
      # changed.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ vars.AWS_REGION || 'af-south-1' }}

      - name: Terraform init
        run: terraform init -backend-config=environments/staging.backend.hcl -input=false
        working-directory: terraform

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file=environments/staging.tfvars
        working-directory: terraform
