name: Deploy Staging

# Manual only — no push trigger. Run from the Actions tab after a PR has merged into
# `staging`. The `environment: staging` block below is enforced by this repo's GitHub
# Environment "Deployment branches and tags" rule (Settings -> Environments -> staging),
# which must be restricted to the `staging` branch — that's what actually stops this
# from running against the wrong ref, not this workflow file alone.
#
# No longer applies this repo's Terraform stack (DynamoDB/S3/Lambda parser
# pipeline + its CI OIDC role) — that infra was destroyed and is unused now
# that staging reads institution data from the separate eduverify-api-staging
# service (USE_EXTERNAL_API=true, see web/CLAUDE.md). Amplify Hosting itself
# was always created by hand via the Console (see terraform/frontend.tf) and
# auto-deploys web/ on push through its own GitHub connection, independent of
# this workflow. This job is now just the pytest guard on the parser/ package.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Test parser
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - name: Install parser dependencies
        run: pip install -r requirements.txt pytest-cov
        working-directory: parser

      - name: Run pytest (guard against broken deploys)
        run: python -m pytest tests/
        working-directory: parser
