name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Test, package & apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'af-south-1' }}

      - name: Terraform init
        run: terraform init -backend-config=environments/production.backend.hcl -input=false
        working-directory: terraform

      - name: Terraform apply
        run: terraform apply -auto-approve -var-file=environments/production.tfvars
        working-directory: terraform
