name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parser-tests:
    name: Parser tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - name: Install parser dependencies
        run: pip install -r requirements.txt pytest-cov
        working-directory: parser

      - name: Run pytest with coverage
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml
        working-directory: parser

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: parser-coverage
          path: parser/coverage.xml

  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      # No remote backend is configured, so init without a backend just
      # downloads providers/modules — no AWS credentials needed to validate.
      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform
